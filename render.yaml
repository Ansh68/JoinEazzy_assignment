# Render Blueprint for the API. In Render: New > Blueprint > pick this repo.
# The frontend is deployed separately on Vercel (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: joineazy-api
    runtime: node
    rootDir: backend
    plan: free
    # Dev-only packages (nodemon, node-pg-migrate, pg) are not needed to run the API.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      # Random 256-bit secret generated by Render the first time. Used to sign login tokens.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # The three below are filled in by hand in the Render dashboard (sync: false keeps them out of git).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # The deployed Vercel URL, e.g. https://your-app.vercel.app (several can be comma-separated).
      - key: CLIENT_URL
        sync: false
